[package]
name = "syscalls-standalone"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Emit self-contained C/H/MASM syscall drop-in bundle from lib.rs"
license = "MIT"
default-run = "syscalls-standalone"

[[bin]]
name = "syscalls-standalone"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0.119", features = ["full"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
