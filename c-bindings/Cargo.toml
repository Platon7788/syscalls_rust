[package]
name = "syscalls-c"
version = "0.1.0"
edition = "2024"
description = "C bindings for SysWhispers3 direct syscall library"
license = "MIT"
build = "build.rs"

[lib]
name = "syscalls"
crate-type = ["staticlib", "cdylib"]

[dependencies]
syscalls = { path = ".." }

[build-dependencies]
regex = "1"
