[package]
name = "syscalls-c"
version = "0.1.0"
edition = "2021"
description = "C bindings for SysWhispers3 direct syscall library"
license = "MIT"
build = "build.rs"

[lib]
name = "syscalls"
crate-type = ["staticlib", "cdylib"]

[dependencies]
syscalls = { path = ".." }

[build-dependencies]
regex = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
