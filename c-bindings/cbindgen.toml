# cbindgen configuration for syscalls-c

language = "C"
header = """/**
 * SysWhispers3 Direct Syscalls - C/C++ Header
 * 
 * Auto-generated by cbindgen - DO NOT EDIT MANUALLY
 * 
 * Direct NT syscalls without going through ntdll.dll
 * Bypasses usermode hooks and EDR/AV monitoring.
 * 
 * Build: cargo build --release
 * Output: syscalls.lib (static) + syscalls.dll (dynamic)
 */

#ifndef SYSCALLS_H
#define SYSCALLS_H

#include <stdint.h>
#include <stddef.h>

#ifdef __cplusplus
extern "C" {
#endif

/* ==================== Type Definitions ==================== */

typedef void* HANDLE;
typedef HANDLE* PHANDLE;
typedef void* PVOID;
typedef int32_t NTSTATUS;
typedef uint32_t ULONG;
typedef ULONG* PULONG;
typedef size_t SIZE_T;
typedef SIZE_T* PSIZE_T;
typedef size_t ULONG_PTR;
typedef uint32_t ACCESS_MASK;
typedef uint8_t BOOLEAN;
typedef int64_t LARGE_INTEGER;
typedef LARGE_INTEGER* PLARGE_INTEGER;
typedef uint16_t USHORT;
typedef uint16_t WCHAR;
typedef WCHAR* PWSTR;

typedef struct {
    USHORT Length;
    USHORT MaximumLength;
    PWSTR Buffer;
} UNICODE_STRING, *PUNICODE_STRING;

typedef struct {
    ULONG Length;
    HANDLE RootDirectory;
    PUNICODE_STRING ObjectName;
    ULONG Attributes;
    PVOID SecurityDescriptor;
    PVOID SecurityQualityOfService;
} OBJECT_ATTRIBUTES, *POBJECT_ATTRIBUTES;

typedef struct {
    NTSTATUS Status;
    ULONG_PTR Information;
} IO_STATUS_BLOCK, *PIO_STATUS_BLOCK;

typedef struct {
    HANDLE UniqueProcess;
    HANDLE UniqueThread;
} CLIENT_ID, *PCLIENT_ID;

typedef struct {
    PVOID BaseAddress;
    PVOID AllocationBase;
    ULONG AllocationProtect;
    SIZE_T RegionSize;
    ULONG State;
    ULONG Protect;
    ULONG Type;
} MEMORY_BASIC_INFORMATION, *PMEMORY_BASIC_INFORMATION;

typedef PVOID PTOKEN_PRIVILEGES;
typedef PVOID PCONTEXT;
typedef PVOID PIO_APC_ROUTINE;

/* ==================== Constants ==================== */

#define STATUS_SUCCESS              ((NTSTATUS)0x00000000)
#define STATUS_TIMEOUT              ((NTSTATUS)0x00000102)
#define STATUS_PENDING              ((NTSTATUS)0x00000103)
#define STATUS_BUFFER_OVERFLOW      ((NTSTATUS)0x80000005)
#define STATUS_UNSUCCESSFUL         ((NTSTATUS)0xC0000001)
#define STATUS_INFO_LENGTH_MISMATCH ((NTSTATUS)0xC0000004)
#define STATUS_ACCESS_VIOLATION     ((NTSTATUS)0xC0000005)
#define STATUS_INVALID_HANDLE       ((NTSTATUS)0xC0000008)
#define STATUS_INVALID_PARAMETER    ((NTSTATUS)0xC000000D)
#define STATUS_NO_MEMORY            ((NTSTATUS)0xC0000017)
#define STATUS_ACCESS_DENIED        ((NTSTATUS)0xC0000022)
#define STATUS_BUFFER_TOO_SMALL     ((NTSTATUS)0xC0000023)

#define NT_SUCCESS(Status) ((NTSTATUS)(Status) >= 0)

#define PAGE_NOACCESS           0x01
#define PAGE_READONLY           0x02
#define PAGE_READWRITE          0x04
#define PAGE_EXECUTE            0x10
#define PAGE_EXECUTE_READ       0x20
#define PAGE_EXECUTE_READWRITE  0x40
#define PAGE_GUARD              0x100

#define MEM_COMMIT              0x00001000
#define MEM_RESERVE             0x00002000
#define MEM_DECOMMIT            0x00004000
#define MEM_RELEASE             0x00008000
#define MEM_FREE                0x00010000
#define MEM_TOP_DOWN            0x00100000
#define MEM_LARGE_PAGES         0x20000000

#define PROCESS_TERMINATE           0x0001
#define PROCESS_CREATE_THREAD       0x0002
#define PROCESS_VM_OPERATION        0x0008
#define PROCESS_VM_READ             0x0010
#define PROCESS_VM_WRITE            0x0020
#define PROCESS_QUERY_INFORMATION   0x0400
#define PROCESS_ALL_ACCESS          0x1FFFFF

#define THREAD_TERMINATE            0x0001
#define THREAD_SUSPEND_RESUME       0x0002
#define THREAD_GET_CONTEXT          0x0008
#define THREAD_SET_CONTEXT          0x0010
#define THREAD_ALL_ACCESS           0x1FFFFF

#define SYNCHRONIZE                 0x00100000
#define GENERIC_READ                0x80000000
#define GENERIC_WRITE               0x40000000
#define GENERIC_EXECUTE             0x20000000
#define GENERIC_ALL                 0x10000000

#define OBJ_INHERIT             0x00000002
#define OBJ_CASE_INSENSITIVE    0x00000040
#define OBJ_KERNEL_HANDLE       0x00000200

#define InitializeObjectAttributes(p, n, a, r, s) { \\
    (p)->Length = sizeof(OBJECT_ATTRIBUTES); \\
    (p)->RootDirectory = r; \\
    (p)->Attributes = a; \\
    (p)->ObjectName = n; \\
    (p)->SecurityDescriptor = s; \\
    (p)->SecurityQualityOfService = NULL; \\
}

/* ==================== Functions ==================== */"""

# Disable cbindgen's include guard - we define it in header
include_guard = ""
pragma_once = false
no_includes = true

trailer = """
#ifdef __cplusplus
}
#endif

#endif /* SYSCALLS_H */"""
cpp_compat = true
usize_is_size_t = true

# Style
style = "both"
line_length = 100

# Documentation
documentation = true
documentation_style = "c99"

[export]
include = []
exclude = []
prefix = ""
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque", "functions"]

[enum]
rename_variants = "None"

[struct]
rename_fields = "None"

[fn]
rename_args = "None"

[parse]
parse_deps = false
